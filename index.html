:root{
  --ink:#15100D;
  --shell:#221A15;
  --panel:#2A211B;
  --edge:#3D3028;
  --bone:#EFE6D8;
  --dust:#A08F7F;
  --amber:#E9A63C;
  --amber-deep:#8A5F22;
  --verdigris:#7FA9A1;
  --lamp:1;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--bone);
  font-family:var(--body);
  font-size:18px;
  line-height:1.62;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(120% 60% at 50% -10%, rgba(233,166,60,.16), transparent 60%);
  opacity:var(--lamp);
  transition:opacity .8s ease;
  pointer-events:none;
  z-index:0;
}
.wrap{position:relative;z-index:1;width:100%;max-width:720px;margin:0 auto;padding:0 22px;flex:1;display:flex;flex-direction:column}

/* ---------- plain reading mode ---------- */
body.plain{font-size:19.5px;line-height:1.74}
body.plain .wrap{max-width:620px}
body.plain p{margin:0 0 22px}
body.plain .lede{font-size:21px}
body.plain .quiet{font-size:17px}
body.plain .law-image{font-size:18.5px;color:#BFB0A1}
body.plain .card .v{font-size:21px;line-height:1.36}
body.plain textarea,body.plain .choice{font-size:20px}

/* ---------- the dial ---------- */
.dial{padding:26px 0 4px;position:sticky;top:0;background:linear-gradient(var(--ink) 72%,rgba(21,16,13,0));z-index:5}
.dial-band{position:relative;height:26px;border-bottom:1px solid var(--edge)}
.ticks{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-end}
.tick{width:1px;background:var(--edge);height:5px}
.tick.major{height:11px;background:#4E3E33}
.needle{position:absolute;bottom:-1px;width:2px;height:24px;background:var(--amber);box-shadow:0 0 10px 2px rgba(233,166,60,.55);transform:translateX(-1px);transition:left .7s cubic-bezier(.34,1.22,.5,1)}
.stations{display:flex;justify-content:space-between;padding-top:9px}
.station{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:#5D4C40;background:none;border:0;padding:2px 0;cursor:default;transition:color .4s ease}
.station.visited{color:var(--dust);cursor:pointer}
.station.active{color:var(--amber)}

/* ---------- panels ---------- */
main{flex:1;padding:34px 0 44px}
.panel[hidden]{display:none}
.panel{animation:tune .55s ease both}
@keyframes tune{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--amber-deep);text-transform:uppercase;margin:0 0 18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,9.4vw,62px);line-height:1.02;letter-spacing:-.015em;margin:0 0 10px}
h1 em{font-style:italic;color:var(--amber)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(27px,6.5vw,38px);line-height:1.12;margin:0 0 20px;letter-spacing:-.01em}
.sub{font-style:italic;color:var(--dust);font-size:19px;margin:0 0 34px}
p{margin:0 0 18px}
.lede{font-size:20px}
.quiet{color:var(--dust);font-size:16px}

/* ---------- controls ---------- */
.btn{
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  background:none;color:var(--ink);background-color:var(--amber);
  border:0;padding:14px 26px;border-radius:2px;cursor:pointer;
  transition:background-color .25s ease,transform .15s ease;
}
.btn:hover{background-color:#F5B855}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;color:var(--dust);border:1px solid var(--edge)}
.btn.ghost:hover{background:none;color:var(--bone);border-color:var(--dust)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:28px}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.choices{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.choice{
  text-align:left;background:var(--panel);border:1px solid var(--edge);border-radius:3px;
  padding:16px 18px;cursor:pointer;color:var(--bone);font-family:var(--body);font-size:19px;
  transition:border-color .22s ease,background-color .22s ease,transform .15s ease;
}
.choice:hover{border-color:var(--amber-deep);background:#31261F;transform:translateX(3px)}
.choice .hint{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--dust);margin-top:5px;text-transform:uppercase}

textarea{
  width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:3px;
  color:var(--bone);font-family:var(--body);font-size:19px;line-height:1.55;font-weight:300;
  padding:15px 16px;resize:vertical;min-height:104px;
}
textarea::placeholder{color:#6B5A4C;font-style:italic}
textarea:focus{border-color:var(--amber-deep);outline:none}
label.field{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dust);margin:26px 0 9px}

/* ---------- laws ---------- */
.law{border-top:1px solid var(--edge);padding:30px 0 6px}
.law:first-of-type{border-top:0;padding-top:8px}
.law-no{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--amber-deep);display:block;margin-bottom:10px}
.law-title{font-family:var(--display);font-size:clamp(23px,5.4vw,30px);font-weight:400;font-style:italic;line-height:1.2;margin:0 0 16px;color:var(--bone)}
.law-image{color:var(--dust);font-size:17px;margin-bottom:16px}
.law-you{border-left:2px solid var(--amber-deep);padding-left:17px}
.law-you .tag{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);display:block;margin-bottom:7px}

/* ---------- note ---------- */
.note{background:rgba(127,169,161,.07);border-left:2px solid var(--verdigris);padding:14px 17px;margin:26px 0;font-size:16px;color:#C9BCAE}
.note strong{color:var(--verdigris);font-weight:400;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:6px}
body.plain .note{font-size:17.5px}

.counter{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--dust);margin-bottom:16px}

/* ---------- pocket cards ---------- */
.cards{display:grid;grid-template-columns:1fr;gap:12px;margin-top:8px}
@media(min-width:560px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:3px;padding:19px}
.card.mine{border-color:var(--amber-deep);background:#31261F}
.card .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber-deep);display:block;margin-bottom:9px}
.card.mine .k{color:var(--amber)}
.card .v{font-family:var(--display);font-size:19px;line-height:1.32;font-weight:400}

/* ---------- footer / care ---------- */
footer{position:relative;z-index:1;border-top:1px solid var(--edge);padding:18px 22px 28px;text-align:center;display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.care-link{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6B5A4C;background:none;border:0;cursor:pointer;transition:color .25s ease}
.care-link:hover{color:var(--verdigris)}
#plain-btn:hover{color:var(--amber)}
#plain-btn.on{color:var(--amber)}
dialog{border:1px solid var(--edge);background:var(--shell);color:var(--bone);max-width:520px;width:calc(100% - 40px);border-radius:3px;padding:30px 28px;font-family:var(--body);font-weight:300;line-height:1.6}
dialog::backdrop{background:rgba(10,7,5,.82)}
dialog h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 16px}
dialog a{color:var(--verdigris)}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media print{
  body{background:#fff;color:#000}
  body::before,.dial,footer,.row,.no-print{display:none!important}
  .card{border:1px solid #999;background:#fff;break-inside:avoid}
  .card .k{color:#666}
  .card.mine{background:#fff}
  .cards{grid-template-columns:1fr 1fr}
}
</style>
</head>

  "pocket-h":{rich:"Carry this in a pocket, a phone, a drawer.", plain:"Keep these somewhere you will see them."},
  "pocket-q":{rich:"Read one line. The laws do not expire, and neither do you. You just change stations. These cards are a permission slip: they do not change you, they remind you that you are allowed to change.",
              plain:"Read one line when things get hard. The laws do not run out, and neither do you. The cards do not change you. They just remind you that you are allowed to."},
  "pocket-save":{rich:"Nothing here is saved anywhere. Close the tab and it is gone, so print or copy these now if you want to keep them.",
                 plain:"None of this is saved. Close the tab and it is gone, so print or copy these now if you want to keep them."},

  "care-h":{rich:"When a page is not enough", plain:"When a page is not enough"},
  "care-1":{rich:"Some things are not a belief to be re-tuned. Grief, illness, abuse, poverty, a brain running a chemistry you did not order. Those are real, and they were not your creation.",
            plain:"Some things are not a belief you can change your mind about. Grief, illness, being hurt by someone, having no money, a brain that works differently to how you would like. Those are real, and none of them are your fault."},
  "care-2":{rich:"If you are in danger, or thinking about hurting yourself, talk to a person tonight rather than a page. Someone you trust, your doctor, or a crisis line where you live.",
            plain:"If you are in danger, or thinking about hurting yourself, talk to a person today rather than a page. An adult you trust, your doctor, or a helpline where you live."},
  "care-3":{rich:"Asking is not a failure of any law. It is Law Two, working exactly as designed.",
            plain:"Asking for help is not breaking any of these laws. It is Law Two, doing exactly what it is meant to do."}
};

/* ---------------- copy application ---------------- */

function setText(id, txt){ var e = document.getElementById(id); if (e) e.textContent = txt; }

function applyCopy(){
  for (var id in COPY){ if (COPY.hasOwnProperty(id)) setText(id, r(COPY[id])); }

  document.getElementById("c1").placeholder = P() ? "The thing I would love to do is..." : "The thing I would do if nobody needed a reason...";
  document.getElementById("c2").placeholder = P() ? "What I really want is..." : "What I actually want is...";
  document.getElementById("c3").placeholder = P() ? "Today or tomorrow I will..." : "Before this time tomorrow, I will...";
  document.getElementById("c4").placeholder = P() ? "If it does not go to plan, I could still..." : "If it goes sideways, I will use it to...";

  var pb = document.getElementById("plain-btn");
  pb.textContent = P() ? "Say it fuller" : "Say it simpler";
  pb.classList.toggle("on", P());
  document.getElementById("dw-plain").textContent = P() ? "Say it fuller" : "Say it simpler";
  document.body.classList.toggle("plain", P());

  buildChoices(document.getElementById("door-choices"), DOORS, pickDoor);
  buildChoices(document.getElementById("mood-choices"), MOODS, pickMood);

  var careLink = document.getElementById("care-2");
  if (careLink && careLink.querySelectorAll("a").length === 0){
    careLink.insertAdjacentHTML("beforeend", " <a href='https://findahelpline.com' target='_blank' rel='noopener'>findahelpline.com</a> lists them by country.");
  }
}

/* ---------------- dial ---------------- */

var ticksEl = document.getElementById("ticks");
for (var i=0;i<73;i++){
  var t = document.createElement("div");
  t.className = "tick" + (i%6===0 ? " major" : "");
  ticksEl.appendChild(t);
}

var stationsEl = document.getElementById("stations");
STATIONS.forEach(function(s){
  var b = document.createElement("button");
  b.className = "station";
  b.textContent = s.label;
  b.dataset.id = s.id;
  b.addEventListener("click", function(){ if (state.visited[s.id]) go(s.id); });
  stationsEl.appendChild(b);
});

function paintDial(){
  var idx = STATIONS.map(function(s){return s.id;}).indexOf(current);
  if (idx < 0) idx = 0;
  var pos = ((idx + 0.5) / STATIONS.length) * 100;
  document.getElementById("needle").style.left = pos + "%";
  Array.prototype.forEach.call(stationsEl.children, function(b){
    b.classList.toggle("active", b.dataset.id === current);
    b.classList.toggle("visited", !!state.visited[b.dataset.id]);
  });
}

/* ---------------- navigation ---------------- */

function go(id){
  current = id;
  state.visited[id] = true;
  Array.prototype.forEach.call(document.querySelectorAll(".panel"), function(p){
    p.hidden = (p.id !== "p-" + id);
  });
  render();
  paintDial();
  window.scrollTo({top:0, behavior:"smooth"});
}

function render(){
  applyCopy();
  if (current === "laws")    renderLaws();
  if (current === "dig")     renderDig();
  if (current === "pocket")  renderPocket();
}

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-go]");
  if (b) go(b.dataset.go);
});

/* ---------------- choice screens ---------------- */

function buildChoices(host, items, onPick){
  if (!host) return;
  host.innerHTML = "";
  items.forEach(function(it){
    var b = document.createElement("button");
    b.className = "choice";
    b.appendChild(document.createTextNode(r(it.label)));
    var s = document.createElement("span");
    s.className = "hint";
    s.textContent = r(it.hint);
    b.appendChild(s);
    b.addEventListener("click", function(){ onPick(it.id); });
    host.appendChild(b);
  });
}

function pickDoor(id){
  state.door = id;
  go("mood");
}

function pickMood(id){
  state.mood = id;
  document.documentElement.style.setProperty("--lamp", MOOD_LAMP[id]);
  go(id === "tender" ? "tender" : "laws");
}

/* ---------------- laws ---------------- */

function renderLaws(){
  var door = state.door || "restless";
  var mood = state.mood || "steady";
  setText("laws-intro", r(MOOD_INTRO[mood]) || "");
  var host = document.getElementById("laws-body");
  host.innerHTML = "";

  LAWS.forEach(function(l){
    var d = document.createElement("div");
    d.className = "law";

    var no = document.createElement("span");
    no.className = "law-no"; no.textContent = l.n.toUpperCase();

    var ti = document.createElement("p");
    ti.className = "law-title"; ti.textContent = r(l.title);

    var im = document.createElement("p");
    im.className = "law-image"; im.textContent = r(l.image);

    var you = document.createElement("div");
    you.className = "law-you";
    var tag = document.createElement("span");
    tag.className = "tag"; tag.textContent = r(DOOR_TAG[door]);
    var p = document.createElement("p");
    p.style.margin = "0"; p.textContent = r(l[door]);
    you.appendChild(tag); you.appendChild(p);

    d.appendChild(no); d.appendChild(ti); d.appendChild(im); d.appendChild(you);

    if (l.caveat){
      var note = document.createElement("div");
      note.className = "note";
      var strong = document.createElement("strong");
      strong.textContent = P() ? "Read this bit twice" : "One important thing";
      var np = document.createElement("span");
      np.textContent = r(l.caveat);
      note.appendChild(strong); note.appendChild(np);
      d.appendChild(note);
    }

    host.appendChild(d);
  });
}

/* ---------------- excavation ---------------- */

function renderDig(){
  var i = state.digStep;
  var step = DIG[i];
  var host = document.getElementById("dig-body");
  host.innerHTML = "";

  var c = document.createElement("p");
  c.className = "counter";
  c.textContent = "STEP " + (i+1) + " OF " + DIG.length;
  host.appendChild(c);

  var h = document.createElement("h2");
  h.textContent = r(step.h);
  host.appendChild(h);

  var p = document.createElement("p");
  p.textContent = r(step.p);
  host.appendChild(p);

  if (i === 0){
    var note = document.createElement("div");
    note.className = "note";
    var strong = document.createElement("strong");
    strong.textContent = P() ? "Read this first" : "Read this once";
    var np = document.createElement("span");
    np.textContent = r(DIG_NOTE);
    note.appendChild(strong); note.appendChild(np);
    host.appendChild(note);
  }

  if (step.choices){
    var wrap = document.createElement("div");
    wrap.className = "choices";
    r(step.choices).forEach(function(ch){
      var b = document.createElement("button");
      b.className = "choice";
      b.textContent = ch;
      b.addEventListener("click", function(){
        state.dig.verdict = ch;
        showVerdict(host, ch);
      });
      wrap.appendChild(b);
    });
    host.appendChild(wrap);
    host.appendChild(skipRow());
  } else {
    var ta = document.createElement("textarea");
    ta.value = state.dig[step.k] || "";
    ta.placeholder = r(step.ph);
    ta.id = "dig-input";
    host.appendChild(ta);
    host.appendChild(navRow(function(){
      state.dig[step.k] = ta.value.trim();
      advance();
    }));
  }
}

function showVerdict(host, choice){
  host.innerHTML = "";
  var c = document.createElement("p");
  c.className = "counter"; c.textContent = "STEP 4 OF " + DIG.length;
  var h = document.createElement("h2"); h.textContent = choice + ".";
  var p = document.createElement("p");
  p.textContent = VERDICT_REPLY[choice] || "";
  host.appendChild(c); host.appendChild(h); host.appendChild(p);
  host.appendChild(navRow(advance));
}

function skipRow(){
  var row = document.createElement("div");
  row.className = "row";
  var s = document.createElement("button");
  s.className = "btn ghost";
  s.textContent = P() ? "Skip this bit" : "Skip the excavation";
  s.addEventListener("click", function(){ go("compass"); });
  row.appendChild(s);
  return row;
}

function navRow(next){
  var row = document.createElement("div");
  row.className = "row";
  var n = document.createElement("button");
  n.className = "btn";
  n.textContent = state.digStep === DIG.length - 1 ? (P() ? "Done" : "Done digging") : "Continue";
  n.addEventListener("click", next);
  row.appendChild(n);
  if (state.digStep > 0){
    var b = document.createElement("button");
    b.className = "btn ghost";
    b.textContent = "Back";
    b.addEventListener("click", function(){ state.digStep--; renderDig(); });
    row.appendChild(b);
  }
  var s = document.createElement("button");
  s.className = "btn ghost";
  s.textContent = P() ? "Skip this bit" : "Skip the excavation";
  s.addEventListener("click", function(){ go("compass"); });
  row.appendChild(s);
  return row;
}

function advance(){
  if (state.digStep < DIG.length - 1){
    state.digStep++;
    renderDig();
    window.scrollTo({top:0, behavior:"smooth"});
  } else {
    go("compass");
  }
}

/* ---------------- pocket ---------------- */

function val(id){ var e = document.getElementById(id); return e ? e.value.trim() : ""; }

function renderPocket(){
  var host = document.getElementById("pocket-cards");
  host.innerHTML = "";
  var mine = [];
  if (state.dig.swap)  mine.push({k:P()?"Your new sentence":"Your station", v:state.dig.swap});
  if (state.dig.proof) mine.push({k:P()?"Your small thing":"Today's proof", v:state.dig.proof});
  if (val("c1"))       mine.push({k:P()?"What excites you":"The signal", v:val("c1")});
  if (val("c2"))       mine.push({k:P()?"What you want":"The outcome", v:val("c2")});
  if (val("c3"))       mine.push({k:P()?"Your next step":"The next act", v:val("c3")});
  if (val("c4"))       mine.push({k:P()?"If it goes differently":"Whatever happens", v:val("c4")});

  function card(k, v, mineFlag){
    var d = document.createElement("div");
    d.className = "card" + (mineFlag ? " mine" : "");
    var ks = document.createElement("span"); ks.className = "k"; ks.textContent = k;
    var vs = document.createElement("div"); vs.className = "v"; vs.textContent = v;
    d.appendChild(ks); d.appendChild(vs);
    host.appendChild(d);
  }

  mine.forEach(function(m){ card(m.k, m.v, true); });
  POCKET.forEach(function(m){ card(r(m.k), r(m.v), false); });
}

document.getElementById("print-btn").addEventListener("click", function(){ window.print(); });

document.getElementById("copy-btn").addEventListener("click", function(){
  var lines = ["LIVING THE BEST VERSION OF YOU - pocket cards",""];
  Array.prototype.forEach.call(document.querySelectorAll("#pocket-cards .card"), function(c){
    lines.push(c.querySelector(".k").textContent.toUpperCase());
    lines.push(c.querySelector(".v").textContent);
    lines.push("");
  });
  var text = lines.join("\n");
  var btn = document.getElementById("copy-btn");
  function done(){ btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = "Copy as text"; }, 1800); }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){ btn.textContent = "Copy failed - select the cards instead"; }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, fallback);
  } else { fallback(); }
});

document.getElementById("restart-btn").addEventListener("click", function(){
  var keepPlain = state.plain, touched = state.plainTouched;
  state = {door:null, mood:null, digStep:0, dig:{}, plain:keepPlain, plainTouched:touched, visited:{doorway:true}};
  ["c1","c2","c3","c4"].forEach(function(id){ document.getElementById(id).value = ""; });
  document.documentElement.style.setProperty("--lamp", 1);
  go("doorway");
});

/* ---------------- plain language toggle ---------------- */

function togglePlain(){
  state.plain = !state.plain;
  state.plainTouched = true;
  render();
}
document.getElementById("plain-btn").addEventListener("click", togglePlain);
document.getElementById("dw-plain").addEventListener("click", togglePlain);

/* ---------------- care dialog ---------------- */

var dlg = document.getElementById("care-dialog");
document.getElementById("care-btn").addEventListener("click", function(){
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
});
document.getElementById("care-close").addEventListener("click", function(){
  if (dlg.close) dlg.close(); else dlg.removeAttribute("open");
});

/* ---------------- boot ---------------- */

applyCopy();
paintDial();
})();
</script>
</body>
</html>
